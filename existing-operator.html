<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Existing Operator — LAGNAF&trade; Network LLC</title>
    <meta name="description" content="Existing operator portal." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="stylesheet" href="css/system.css" />
</head>
<body>

<header class="sys-header">
  <div class="sys-logo"><img src="images/logo.jpg" alt="LAGNAF&trade; Network LLC" style="height:56px;display:block;" /></div>
  <span class="sys-step-indicator">Existing Operator — Identity Verification</span>
</header>

<div class="sys-page">
  <div class="sys-card">

    <span class="sys-eyebrow">Existing Operator Flow</span>
    <h1 class="sys-title">Operator Login</h1>
    <div class="sys-divider"></div>
    <p class="sys-sub">Enter your Unique Identification Number or registered email address to access your operator dashboard.</p>

    <form id="login-form">
      <div class="sys-form-group">
        <label for="uin-input">Unique Identification Number (UIN)</label>
        <input type="text" id="uin-input" name="uin" placeholder="e.g. DRY-XXXXXXXX" style="font-family:monospace;letter-spacing:0.1em;text-transform:uppercase;" />
      </div>

      <div style="display:flex;align-items:center;gap:12px;margin:16px 0;">
        <div style="flex:1;height:1px;background:#e5e5e5;"></div>
        <span style="font-size:0.65rem;color:#bbb;letter-spacing:0.1em;">OR</span>
        <div style="flex:1;height:1px;background:#e5e5e5;"></div>
      </div>

      <div class="sys-form-group">
        <label for="email-input">Registered Email Address</label>
        <input type="email" id="email-input" name="email" placeholder="your@email.com" />
      </div>

      <div id="login-error" style="display:none;background:#fff5f5;border:1px solid #f5c6cb;border-left:3px solid #e74c3c;padding:12px 16px;margin:16px 0;font-size:0.73rem;color:#721c24;"></div>

      <div style="margin-top:24px;">
        <button type="submit" class="btn-sys-primary btn-full">Access Dashboard ?</button>
      </div>
    </form>

    <div style="margin-top:24px;padding-top:20px;border-top:1px solid #f0f0f0;">
      <p style="font-size:0.7rem;color:#aaa;text-align:center;margin-bottom:12px;">Cannot locate your account?</p>
      <a href="tel:9493508804" class="btn-sys-dark btn-full" style="display:block;text-align:center;padding:12px;">Contact Support — 949-350-8804</a>
    </div>

    <p style="margin-top:20px;text-align:center;"><a href="path-routing.html" style="font-size:0.68rem;color:#aaa;text-decoration:underline;">? Back to Path Selection</a></p>

  </div>
</div>

<script src="js/flow.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  Flow.requirePath('existing-operator');
});

document.getElementById('login-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const uin = document.getElementById('uin-input').value.trim().toUpperCase();
  const email = document.getElementById('email-input').value.trim();
  const errorEl = document.getElementById('login-error');

  if (!uin && !email) {
    errorEl.style.display = 'block';
    errorEl.textContent = 'Please enter your UIN or registered email address.';
    return;
  }

  // Check against stored session UIN
  const storedUIN = Flow.get('uin');
  const storedEntry = Flow.get('entry');

  if ((uin && storedUIN && uin === storedUIN) || (email && storedEntry && email.toLowerCase() === storedEntry.email.toLowerCase())) {
    window.location.href = 'operator-dashboard.html';
  } else {
    errorEl.style.display = 'block';
    errorEl.textContent = 'Account not found. Please verify your UIN or email, or contact support at 949-350-8804.';
  }
});
</script>
</body>
</html>
