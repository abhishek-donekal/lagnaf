<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAGNAF™ Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #080808;
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── BACKGROUND ── */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('https://lagnafnetwork.com/wp-content/uploads/2026/02/image-43.jpg');
      background-size: cover;
      background-position: center 30%;
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 2.2s ease, transform 9s ease;
      z-index: 0;
    }
    .bg.visible { opacity: 1; transform: scale(1); }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5,5,5,0.82);
      z-index: 1;
    }

    /* subtle vignette */
    .bg-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 100%);
      z-index: 2;
    }

    /* ── NAV ── */
    .nav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 32px 52px;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.8s ease 0.6s, transform 0.8s ease 0.6s;
    }
    .nav.visible { opacity: 1; transform: translateY(0); }

    .nav-logo {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #fff;
    }

    .nav-contact {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.3);
      transition: color 0.2s;
    }
    .nav-contact:hover { color: rgba(255,255,255,0.7); }

    /* ── MAIN ── */
    .main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      text-align: center;
    }

    .invitation-mark {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.9s ease 0.9s, transform 0.9s ease 0.9s;
    }
    .invitation-mark.visible { opacity: 1; transform: translateY(0); }

    .invitation-mark::before,
    .invitation-mark::after {
      content: '';
      display: block;
      width: 48px;
      height: 1px;
      background: #b89d6a;
    }

    .invitation-mark span {
      font-size: 0.48rem;
      font-weight: 600;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #b89d6a;
    }

    .main-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 6vw, 5.2rem);
      font-weight: 300;
      font-style: italic;
      color: #fff;
      line-height: 1.1;
      letter-spacing: 0.02em;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1s ease 1.1s, transform 1s ease 1.1s;
    }
    .main-heading.visible { opacity: 1; transform: translateY(0); }

    .main-sub {
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      line-height: 2;
      max-width: 360px;
      margin-bottom: 52px;
      opacity: 0;
      transition: opacity 0.9s ease 1.4s;
    }
    .main-sub.visible { opacity: 1; }

    .enter-btn {
      display: inline-block;
      background: transparent;
      border: 1px solid rgba(184,157,106,0.55);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      padding: 18px 56px;
      cursor: pointer;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.9s ease 1.65s, border-color 0.3s, background 0.3s;
    }
    .enter-btn.visible { opacity: 1; }
    .enter-btn:hover {
      border-color: #b89d6a;
      background: rgba(184,157,106,0.1);
    }

    /* ── FOOTER ── */
    .foot {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 52px;
      opacity: 0;
      transition: opacity 0.8s ease 1.9s;
    }
    .foot.visible { opacity: 1; }

    .foot-copy {
      font-size: 0.52rem;
      color: rgba(255,255,255,0.15);
      letter-spacing: 0.08em;
    }

    .foot-links {
      display: flex;
      gap: 24px;
    }
    .foot-links a {
      font-size: 0.5rem;
      color: rgba(255,255,255,0.18);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s;
    }
    .foot-links a:hover { color: rgba(255,255,255,0.5); }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      .nav { padding: 24px 28px; }
      .foot { padding: 20px 28px; flex-direction: column; gap: 12px; text-align: center; }
      .invitation-mark::before, .invitation-mark::after { width: 28px; }
      .enter-btn { padding: 16px 40px; }
      body { overflow-y: auto; }
    }
  </style>
</head>
<body>

  <div class="bg" id="bg"></div>
  <div class="bg-overlay"></div>
  <div class="bg-vignette"></div>

  <!-- NAV -->
  <nav class="nav" id="nav">
    <div class="nav-logo">LAGNAF™ Network</div>
    <a href="tel:9493508804" class="nav-contact">949-350-8804</a>
  </nav>

  <!-- MAIN -->
  <main class="main">
    <div class="invitation-mark" id="mark">
      <span>By Invitation Only</span>
    </div>

    <h1 class="main-heading" id="heading">
      Congratulations on<br>Your Invitation.
    </h1>

    <p class="main-sub" id="sub">
      You have been granted access consideration<br>
      to a private operating network.
    </p>

    <a href="welcome.html" class="enter-btn" id="btn">Enter the Network</a>
  </main>

  <!-- FOOT -->
  <div class="foot" id="foot">
    <span class="foot-copy">© 2026 LAGNAF™ network LLC. All Rights Reserved.</span>
    <div class="foot-links">
      <a href="privacy-policy.html">Privacy</a>
      <a href="terms-of-service.html">Terms</a>
      <a href="disclaimer.html">Disclaimer</a>
    </div>
  </div>

  <script>
    // Staggered entrance
    window.addEventListener('load', function() {
      setTimeout(function() { document.getElementById('bg').classList.add('visible'); }, 100);
      setTimeout(function() { document.getElementById('nav').classList.add('visible'); }, 200);
      setTimeout(function() { document.getElementById('mark').classList.add('visible'); }, 400);
      setTimeout(function() { document.getElementById('heading').classList.add('visible'); }, 600);
      setTimeout(function() { document.getElementById('sub').classList.add('visible'); }, 900);
      setTimeout(function() { document.getElementById('btn').classList.add('visible'); }, 1100);
      setTimeout(function() { document.getElementById('foot').classList.add('visible'); }, 1300);
    });
  </script>

</body>
</html>
