<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAGNAF™ Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a0a0a;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    .tap-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      position: relative;
    }

    /* Subtle radial glow behind logo */
    .tap-page::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 400px;
      height: 400px;
      background: radial-gradient(ellipse at center, rgba(184,157,106,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .tap-wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.8rem, 10vw, 4.4rem);
      font-weight: 300;
      letter-spacing: 0.22em;
      color: #fff;
      line-height: 1;
      margin-bottom: 6px;
    }

    .tap-tm {
      font-size: 0.9rem;
      vertical-align: super;
      color: #b89d6a;
    }

    .tap-rule {
      width: 48px;
      height: 1px;
      background: #b89d6a;
      margin: 20px auto;
    }

    .tap-eyebrow {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 28px;
    }

    .tap-headline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.3rem, 5vw, 1.9rem);
      font-weight: 300;
      color: #e8e0d0;
      line-height: 1.4;
      max-width: 360px;
      margin: 0 auto 12px;
    }

    .tap-sub {
      font-size: 0.72rem;
      color: #555;
      line-height: 1.8;
      max-width: 300px;
      margin: 0 auto 40px;
    }

    .tap-ref-badge {
      display: none;
      background: #111;
      border: 1px solid #222;
      border-left: 2px solid #b89d6a;
      padding: 10px 20px;
      margin-bottom: 32px;
      font-size: 0.65rem;
      color: #888;
      letter-spacing: 0.06em;
    }

    .tap-ref-badge span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.85rem;
      color: #b89d6a;
      letter-spacing: 0.12em;
      margin-left: 6px;
    }

    .tap-cta {
      display: inline-block;
      background: #b89d6a;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 16px 40px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      cursor: pointer;
      border: none;
    }

    .tap-cta:hover {
      background: #a08a5a;
    }

    .tap-footer {
      position: absolute;
      bottom: 28px;
      font-size: 0.58rem;
      color: #333;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Mobile refinements */
    @media (max-width: 480px) {
      .tap-page { padding: 32px 20px; }
      .tap-cta { padding: 14px 32px; width: 100%; max-width: 280px; }
    }
  </style>
</head>
<body>

<div class="tap-page">

  <div class="tap-wordmark">LAGNAF<span class="tap-tm">™</span></div>
  <div class="tap-rule"></div>
  <div class="tap-eyebrow">Private Network · By Invitation</div>

  <h1 class="tap-headline">You've Been Introduced to the Network</h1>
  <p class="tap-sub">Access is permission-based and referral-qualified. Complete the form to begin your consideration request.</p>

  <div class="tap-ref-badge" id="ref-badge">
    Referred by<span id="ref-badge-code">—</span>
  </div>

  <a class="tap-cta" id="cta-link" href="entry-gateway.html">Request Access</a>

  <div class="tap-footer">LAGNAF™ Network LLC &nbsp;·&nbsp; lagnafnetwork.com</div>

</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var ref = params.get('ref') || '';
  if (ref && /^LAGNAF-[A-Z0-9]{4,8}$/i.test(ref)) {
    var code = ref.toUpperCase();
    // Show referral badge
    var badge = document.getElementById('ref-badge');
    badge.style.display = 'block';
    document.getElementById('ref-badge-code').textContent = code;
    // Append ref to CTA so attribution carries through
    document.getElementById('cta-link').href = 'entry-gateway.html?ref=' + code;
  }
})();
</script>

</body>
</html>
