<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LAGNAF™ Network</title>
  <!-- System fonts render instantly on tap; web fonts load in behind -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .tap-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 28px 100px;
      text-align: center;
      position: relative;
    }

    /* Radial glow */
    .tap-page::before {
      content: '';
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 480px;
      height: 480px;
      background: radial-gradient(ellipse at center, rgba(184,157,106,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .tap-wordmark {
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 300;
      letter-spacing: 0.2em;
      color: #fff;
      line-height: 1;
      margin-bottom: 4px;
    }

    .tap-tm {
      font-size: 0.7em;
      vertical-align: super;
      color: #b89d6a;
      font-size: clamp(1rem, 3vw, 1.4rem);
    }

    .tap-rule {
      width: 40px;
      height: 1px;
      background: #b89d6a;
      margin: 22px auto;
    }

    .tap-eyebrow {
      font-size: clamp(0.5rem, 2vw, 0.6rem);
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 32px;
    }

    .tap-headline {
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      font-size: clamp(1.4rem, 5.5vw, 2rem);
      font-weight: 300;
      color: #e8e0d0;
      line-height: 1.35;
      max-width: 320px;
      margin: 0 auto 14px;
    }

    .tap-sub {
      font-size: clamp(0.68rem, 2.5vw, 0.74rem);
      color: #4a4a4a;
      line-height: 1.8;
      max-width: 280px;
      margin: 0 auto 36px;
    }

    /* Attribution badge — only shown when ?ref= is present */
    .tap-ref-badge {
      display: none;
      background: #111;
      border: 1px solid #1e1e1e;
      border-left: 2px solid #b89d6a;
      padding: 10px 20px;
      margin: 0 auto 28px;
      font-size: 0.62rem;
      color: #777;
      letter-spacing: 0.08em;
      max-width: 280px;
    }

    .tap-ref-badge strong {
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      font-size: 0.88rem;
      color: #b89d6a;
      letter-spacing: 0.12em;
      display: block;
      margin-top: 3px;
    }

    /* Primary CTA */
    .tap-cta-primary {
      display: block;
      width: 100%;
      max-width: 300px;
      background: #b89d6a;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 18px 24px;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
      cursor: pointer;
      border: none;
      /* Minimum 48px touch target already satisfied by padding */
      margin: 0 auto;
      -webkit-tap-highlight-color: transparent;
    }

    .tap-cta-primary:hover,
    .tap-cta-primary:active { background: #a08a5a; }

    /* Secondary CTA */
    .tap-cta-secondary {
      display: block;
      width: 100%;
      max-width: 300px;
      background: transparent;
      border: 1px solid #1e1e1e;
      color: #666;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 15px 24px;
      text-align: center;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
      margin: 10px auto 0;
      -webkit-tap-highlight-color: transparent;
    }

    .tap-cta-secondary:hover,
    .tap-cta-secondary:active { border-color: #b89d6a; color: #b89d6a; }

    /* Sticky footer */
    .tap-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 24px;
      text-align: center;
      font-size: 0.55rem;
      color: #252525;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #0a0a0a;
      border-top: 1px solid #111;
    }

    /* Load web fonts after paint */
    @media (prefers-reduced-motion: no-preference) {
      .tap-wordmark, .tap-headline { transition: opacity 0.2s; }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" /></noscript>
</head>
<body>

<div class="tap-page">

  <div class="tap-wordmark">LAGNAF<span class="tap-tm">™</span></div>
  <div class="tap-rule"></div>
  <div class="tap-eyebrow">Private Network · By Invitation</div>

  <h1 class="tap-headline">You've Been Introduced to the Network</h1>
  <p class="tap-sub">Access is permission-based and referral-qualified. Submit the form below to begin your consideration request.</p>

  <div class="tap-ref-badge" id="ref-badge">
    Referred by<strong id="ref-badge-code">—</strong>
  </div>

  <a class="tap-cta-primary" id="cta-request" href="entry-gateway.html">Request Access</a>
  <a class="tap-cta-secondary" href="tel:9493508804">Call 949-350-8804</a>

</div>

<div class="tap-footer">LAGNAF™ network LLC &nbsp;·&nbsp; Private &amp; Confidential</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var ref = params.get('ref') || '';
  if (ref && /^LAGNAF-[A-Z0-9]{4,8}$/i.test(ref)) {
    var code = ref.toUpperCase();
    var badge = document.getElementById('ref-badge');
    badge.style.display = 'block';
    document.getElementById('ref-badge-code').textContent = code;
    document.getElementById('cta-request').href = 'entry-gateway.html?ref=' + code;
  }
})();
</script>

</body>
</html>
