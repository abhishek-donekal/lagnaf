<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — LAGNAF™ Private Network</title>
  <meta name="description" content="The page you are looking for does not exist or has been moved." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Rajdhani:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/system.css" />
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#060609; color:#fff; text-align:center; padding:40px 24px; }
    .err-code {
      font-family:'Cinzel',serif;
      font-size:clamp(4rem,12vw,8rem);
      font-weight:600;
      background:linear-gradient(155deg,#ffffff 0%,#dce2ea 30%,#f4f6f8 65%,#c8d0da 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      line-height:1;
      margin-bottom:8px;
      filter:drop-shadow(0 0 22px rgba(255,255,255,0.12));
    }
    .err-rule {
      width:60px; height:1px;
      background:linear-gradient(90deg,transparent,#e8c870,transparent);
      margin:0 auto 28px;
      box-shadow:0 0 8px rgba(232,200,112,0.4);
    }
    .err-title {
      font-family:'Cinzel',serif;
      font-size:clamp(0.9rem,2vw,1.2rem);
      font-weight:400;
      letter-spacing:0.22em;
      color:#e8c870;
      margin-bottom:12px;
      text-shadow:0 0 28px rgba(232,200,112,0.4);
    }
    .err-sub {
      font-family:'Cormorant Garamond',serif;
      font-style:italic;
      font-size:clamp(0.8rem,1.4vw,1rem);
      font-weight:300;
      letter-spacing:0.12em;
      background:linear-gradient(135deg,#c8cdd6 0%,#edf0f4 45%,#b8bec8 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      margin-bottom:48px;
    }
    .err-btn {
      display:inline-block;
      font-family:'Rajdhani',sans-serif;
      font-size:0.64rem;
      font-weight:700;
      letter-spacing:0.32em;
      text-transform:uppercase;
      color:#f0d588;
      border:1px solid rgba(232,200,112,0.8);
      padding:16px 52px;
      background:rgba(232,200,112,0.08);
      text-decoration:none;
      box-shadow:0 0 22px rgba(232,200,112,0.15);
      transition:background 0.3s,box-shadow 0.3s,color 0.3s;
    }
    .err-btn:hover {
      background:rgba(232,200,112,0.18);
      box-shadow:0 0 48px rgba(232,200,112,0.4);
      color:#fff8e0;
    }
    .err-logo {
      position:fixed; top:28px; left:50%; transform:translateX(-50%);
    }
    .err-logo img { height:52px; display:block; }
  </style>
</head>
<body>
  <div class="err-logo">
    <a href="index.html"><img src="images/logo.jpg" alt="The LAGNAF Private Network" /></a>
  </div>

  <div class="err-code">404</div>
  <div class="err-rule"></div>
  <div class="err-title">Page Not Found</div>
  <div class="err-sub">This access point does not exist or has been relocated.</div>
  <a href="index.html" class="err-btn">Return to Network →</a>
</body>
</html>
